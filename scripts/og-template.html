<!doctype html>
<!-- OG 分享卡设计稿（1200x630）。重新生成：部署后访问 /og-template.html 截图，或本地 vite preview 后用 Playwright 截图存为 public/og.png -->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 85% -10%, #8b5cf633, transparent),
      radial-gradient(700px 400px at 5% 110%, #22d3ee22, transparent),
      #0b0d14;
    display: flex; align-items: center; padding: 0 90px; gap: 70px;
    position: relative;
  }
  .checker-band {
    position: absolute; left: 0; right: 0; bottom: 0; height: 26px;
    background: repeating-conic-gradient(#1d2130 0% 25%, #12141f 0% 50%) 0 0 / 26px 26px;
    border-top: 1px solid #ffffff14;
  }
  .left { flex: 1.2; }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 34px; }
  .brand img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 12px 40px #8b5cf655; }
  .brand-name { font-size: 64px; font-weight: 800; color: #fff; letter-spacing: 1px; }
  h1 { font-size: 52px; line-height: 1.15; color: #fff; font-weight: 700; margin-bottom: 20px; }
  .grad {
    background: linear-gradient(120deg, #a78bfa, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: 22px; color: #9aa1b5; margin-bottom: 34px; }
  .badges { display: flex; gap: 12px; flex-wrap: wrap; }
  .badge {
    font-size: 17px; color: #c3c9d8; border: 1px solid #ffffff1f;
    background: #ffffff0a; padding: 9px 18px; border-radius: 999px;
  }
  .badge b { color: #4ade80; margin-right: 6px; }
  .demo {
    flex: 0.9; height: 440px; border-radius: 24px; border: 1px solid #ffffff17;
    overflow: hidden; position: relative;
    background: repeating-conic-gradient(#d9dbe3 0% 25%, #ffffff 0% 50%) 0 0 / 36px 36px;
    box-shadow: 0 30px 80px #00000066;
  }
  .cutline {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 3px;
    background: #fff; box-shadow: 0 0 12px #00000088; z-index: 2;
  }
  .knob {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 52px; height: 52px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; color: #111; font-weight: 700; box-shadow: 0 8px 24px #00000099; z-index: 3;
  }
  .tag {
    position: absolute; top: 18px; font-size: 15px; padding: 5px 14px;
    border-radius: 999px; background: #000000b0; color: #fff; z-index: 3;
  }
  .tag-l { left: 18px; } .tag-r { right: 18px; }
  .half { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; }
  .half-l { left: 0; background: linear-gradient(180deg, #7cc4e8, #a8d8f0); }
  .half-r { right: 0; }
  .person {
    position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
    font-size: 200px; line-height: 1;
    filter: drop-shadow(0 8px 20px #00000040);
  }
</style>
</head>
<body>
  <div class="checker-band"></div>
  <div class="left">
    <div class="brand">
      <img src="/brand/n-logo.png" alt="">
      <div class="brand-name">NoBg</div>
    </div>
    <h1>Remove image backgrounds.<br><span class="grad">Free. In your browser.</span></h1>
    <div class="sub">AI 抠图 · 免费在线 · remove.bg 替代品</div>
    <div class="badges">
      <span class="badge"><b>✓</b>无需注册</span>
      <span class="badge"><b>✓</b>图片不上传服务器</span>
      <span class="badge"><b>✓</b>个人使用免费</span>
    </div>
  </div>
  <div class="demo">
    <div class="half half-l"><div class="person">🧍</div></div>
    <div class="half half-r"><div class="person">🧍</div></div>
    <div class="cutline"></div>
    <div class="knob">↔</div>
    <span class="tag tag-l">原图</span>
    <span class="tag tag-r">抠图后</span>
  </div>
</body>
</html>
